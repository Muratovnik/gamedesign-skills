name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event.repository && !github.event.repository.private
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B tools/check.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s examples/adaptation -p 'test_*.py' -v
      - run: python -B -m unittest discover -s examples/analysis-lab -p 'test_*.py' -v
      - run: python -B -m unittest discover -s examples/godot-episode -p 'test_*.py' -v
      - run: python -B -m unittest discover -s examples/design-studies/harbour-of-echoes -p 'test_*.py' -v
      - run: python .github/relkit.pyz audit --history
      - run: python -B tools/release.py build --output dist --version 0.1.0
      - run: python -B tools/smoke.py --assets dist --version 0.1.0 --temp tmp/release-smoke
