name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event.repository && !github.event.repository.private
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B tools/check.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s examples/adaptation -p 'test_*.py' -v
      - run: python -B -m unittest discover -s examples/analysis-lab -p 'test_*.py' -v
      - run: python -B -m unittest discover -s examples/godot-episode -p 'test_*.py' -v
      - run: python -B -m unittest discover -s examples/design-studies/harbour-of-echoes -p 'test_*.py' -v
      - run: python .github/relkit.pyz audit --history
      - name: Read source version
        id: version
        shell: python
        run: |
          import os
          from pathlib import Path
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
      - run: python -B tools/release.py build --output dist --version ${{ steps.version.outputs.version }}
      - run: python -B tools/smoke.py --assets dist --version ${{ steps.version.outputs.version }} --temp tmp/release-smoke

  artifact-operations:
    if: github.event.repository && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install numerical test environment
        run: python -m pip install -r requirements-dev.txt -r skills/game-systems-design/scripts/requirements.txt numpy==2.3.5
      - name: Prepare task-owned optional Node tools
        run: |
          mkdir "$RUNNER_TEMP/gltf-tools" "$RUNNER_TEMP/ink-deps"
          cp skills/game-design/scripts/validate_gltf.cjs skills/game-design/scripts/package*.json "$RUNNER_TEMP/gltf-tools/"
          cp skills/game-world-narrative-design/scripts/package*.json "$RUNNER_TEMP/ink-deps/"
          npm ci --prefix "$RUNNER_TEMP/gltf-tools" --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/ink-deps" --ignore-scripts --no-audit --no-fund
          node --version
      - run: python -B -m unittest discover -s examples/strategy-matrix -p 'test_*.py' -v
      - run: node --test examples/gltf-artifacts/test_validation.cjs
        env:
          GD_GLTF_SCRIPT: ${{ runner.temp }}/gltf-tools/validate_gltf.cjs
      - run: node --test examples/ink-episode/test_ink_artifact.cjs
        env:
          INKJS_ROOT: ${{ runner.temp }}/ink-deps/node_modules/inkjs

  native-clients:
    if: github.event.repository && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Install exact native clients into disposable runner storage
        run: npm install --prefix "$RUNNER_TEMP/native-client-tools" --save-exact --no-audit --no-fund @openai/codex@0.159.2 @anthropic-ai/claude-code@2.1.289
      - name: Retain the comparison baseline as an immutable source
        run: git worktree add --detach "$RUNNER_TEMP/game-design-previous" a0db5af71146586cf861881670c991ad94d87e2b
      - name: Qualify native discovery and local-source lifecycle
        run: >-
          python -B tools/qualify_native_clients.py --disposable-user
          --codex "$RUNNER_TEMP/native-client-tools/node_modules/.bin/codex"
          --claude "$RUNNER_TEMP/native-client-tools/node_modules/.bin/claude"
          --source "$GITHUB_WORKSPACE" --previous "$RUNNER_TEMP/game-design-previous"
          --work "$RUNNER_TEMP/game-design-client-qualification"
          --receipt "$RUNNER_TEMP/native-client-receipt.json"
      - name: Preserve actual client evidence, including incomplete runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-client-evidence
          path: |
            ${{ runner.temp }}/native-client-receipt.json
            ${{ runner.temp }}/native-client-tools/package-lock.json
          if-no-files-found: warn
