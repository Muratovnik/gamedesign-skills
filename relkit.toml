[exposure]
required_ignores = [
  ".cache/scanners",
  ".private/manifest.json",
  ".state/receipt.json",
  "tmp/scratch",
  ".claude/settings.local.json",
  ".codex/config.toml",
]
owner_identities = ["Nikolai Muratov <el.muratovnik@gmail.com>"]
forbid_ai_attribution = true
forbid_internal_planning = true
forbid_machine_observations = true
betterleaks_config = ".betterleaks.toml"
hosted_ci = "public-only"

# The binder's negative test supplies an escaping resource path and asserts its
# rejection. Structural path rules do not apply to this synthetic fixture;
# independent secret scanning and non-excludable owner rules still apply.
# The requested public review preserves raw synthetic observations, source-read
# records, test logs and paths from disposable fixtures. The exact evidence files
# below are records, not installed instructions or runtime path configuration.
# These exclusions skip built-in path/semantic heuristics for those files;
# external secret scanning, archive limits and declared non-excludable private,
# owner-workflow and personal-data rules still apply. See the publication audit
# record for the content review and independently checked scanner boundaries.
exclude = [
  "tests/test_distribution.py",
  "docs/reviews/2026-10-08/evidence/baseline-evidence.zip",
  "docs/reviews/2026-10-08/evidence/correction-evidence.zip",
  "docs/reviews/2026-10-08-comparison/behavior-evidence.zip",
  "docs/reviews/2026-10-08-comparison/behavior-independent-review.zip",
  "docs/reviews/2026-10-08-comparison/final-product-review.zip",
  "docs/reviews/2026-10-08-comparison/integration-evidence.zip",
  "docs/reviews/2026-10-08-comparison/native-model-preflight.zip",
  "docs/reviews/2026-10-08-comparison/publication-audit-evidence.zip",
  "docs/reviews/2026-10-08-comparison/ci-runtime-113456576647.log",
  "docs/reviews/2026-10-08-comparison/ci-runtime-113456576836.log",
  "docs/reviews/2026-10-08-comparison/ci-runtime-113456576892.log",
  "docs/reviews/2026-10-08-comparison/ci-runtime-113456576901.log",
]

[changelog]
profile = "strict"
first_version = "0.1.0"

[release]
publisher = "github"
repository = "Muratovnik/gamedesign-skills"
branch = "main"
version_file = "VERSION"
version_pattern = '^([0-9]+\.[0-9]+\.[0-9]+)$'
assets = ["gamedesign-skills-{version}-source.zip", "SHA256SUMS"]
checksum_file = "SHA256SUMS"
checks = [
  ["{python}", "-B", "tools/check.py"],
  ["{python}", "-B", "-m", "unittest", "discover", "-s", "tests", "-v"],
  ["{python}", "-B", "-m", "unittest", "discover", "-s", "examples/adaptation", "-p", "test_*.py", "-v"],
  ["{python}", "-B", "-m", "unittest", "discover", "-s", "examples/analysis-lab", "-p", "test_*.py", "-v"],
  ["{python}", "-B", "-m", "unittest", "discover", "-s", "examples/godot-episode", "-p", "test_*.py", "-v"],
  ["{python}", "-B", "-m", "unittest", "discover", "-s", "examples/design-studies/harbour-of-echoes", "-p", "test_*.py", "-v"],
]
build = [["{python}", "-B", "tools/release.py", "build", "--output", "{assets}", "--version", "{version}"]]
smoke = [["{python}", "-B", "tools/smoke.py", "--assets", "{assets}", "--version", "{version}", "--temp", "{temp}/gamedesign-smoke"]]
smoke_platforms = ["linux", "win32"]
require_guard = true
owner_audit = true
